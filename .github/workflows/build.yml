name: Build

# Ne compile QUE les versions publiées : un tag vX.Y.Z (major/minor/patch).
# Les pushes sur main ne déclenchent plus rien — plus de build de test
# manuel pour l'instant (workflow_dispatch retiré à la demande). Chaque tag
# produit sa GitHub Release, nouvelle à chaque fois, avec les paquets attachés.
on:
  push:
    tags:
      - 'v*.*.*'

# contents: write : le job release crée la GitHub Release et y attache les paquets.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build natif rapide sur Arch x86_64 : vérifie la compilation sans émulation.
  native-x86_64:
    name: Build natif (Arch x86_64)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Préparer le conteneur
        run: |
          pacman -Syu --noconfirm git cmake qt6-base qt6-declarative libkscreen

      - uses: actions/checkout@v4

      - name: Compiler
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel "$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: wine-mobile-launcher-x86_64
          path: build/wine-mobile-launcher
          if-no-files-found: error

  # Cible principale : Arch Linux ARM (aarch64) via PKGBUILD.
  # Runner ARM64 natif (ubuntu-24.04-arm) : le rootfs ALARM est importé comme
  # image Docker et s'exécute directement, sans émulation QEMU (compilation et
  # pacman bien plus rapides qu'en émulé). Même approche que Cemu-arm64.
  alarm-aarch64:
    name: PKGBUILD Arch Linux ARM (aarch64, runner ARM natif)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      WML_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger et importer le rootfs Arch Linux ARM
        run: |
          curl -fsSL --retry 3 -o /tmp/alarm-rootfs.tar.gz \
            http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
          docker import /tmp/alarm-rootfs.tar.gz alarm:rootfs
          rm -f /tmp/alarm-rootfs.tar.gz

      # makepkg refuse root : tout se fait via l'utilisateur builduser.
      # WML_COMMIT (sha du tag) fixe le commit source ; WML_PKGVER (tag sans
      # son « v ») versionne le paquet d'après la version publiée.
      # makepkg -s installe lui-même depends + makedepends du PKGBUILD.
      - name: makepkg (aarch64)
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # vX.Y.Z -> pkgver X.Y.Z ; vX.Y.Z-N -> pkgver X.Y.Z + pkgrel N
            # (un pkgver pacman ne peut pas contenir de tiret). Autre suffixe
            # (ex. -rc1) -> accolé au pkgver avec un point.
            tag="${GITHUB_REF_NAME#v}"
            export WML_PKGVER="${tag%%-*}"
            if [[ "$tag" == *-* ]]; then
              suffix="${tag#*-}"
              if [[ "$suffix" =~ ^[0-9]+$ ]]; then
                export WML_PKGREL="$suffix"
              else
                export WML_PKGVER="${WML_PKGVER}.${suffix//-/.}"
              fi
            fi
          fi
          mkdir -p artifacts
          docker run --rm \
            -e WML_COMMIT \
            -e WML_PKGVER \
            -e WML_PKGREL \
            -v "$PWD:/work:ro" \
            -v "$PWD/artifacts:/out" \
            alarm:rootfs bash -euxc '
              # En conteneur : pas de test d espace disque, pas de sandbox
              # Landlock, pas de mise à jour du noyau (inutile, hooks en échec).
              sed -i "s/^CheckSpace/#CheckSpace/" /etc/pacman.conf
              sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
              sed -i "/^\[options\]/a IgnorePkg = linux-aarch64 linux-aarch64-headers" /etc/pacman.conf
              sed -i "s/^#ParallelDownloads.*/ParallelDownloads = 5/" /etc/pacman.conf
              pacman-key --init
              pacman-key --populate archlinuxarm
              pacman -Syu --noconfirm --needed base-devel git sudo

              useradd -m builduser
              echo "builduser ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builduser
              mkdir -p /home/builduser/build
              cp /work/packaging/arch/PKGBUILD /home/builduser/build/PKGBUILD
              chown -R builduser:builduser /home/builduser/build
              cd /home/builduser/build
              sudo -Hu builduser env WML_COMMIT="$WML_COMMIT" WML_PKGVER="$WML_PKGVER" WML_PKGREL="$WML_PKGREL" \
                bash -c "makepkg --printsrcinfo > /home/builduser/build/.SRCINFO"
              sudo -Hu builduser env WML_COMMIT="$WML_COMMIT" WML_PKGVER="$WML_PKGVER" WML_PKGREL="$WML_PKGREL" \
                makepkg -sf --noconfirm
              cp -v /home/builduser/build/.SRCINFO /out/
              cp -v /home/builduser/build/*.pkg.tar.* /out/
            '

      - name: Lister les artefacts
        run: ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-alarm-aarch64
          path: artifacts/*
          if-no-files-found: error

  # Publication : une GitHub Release par tag, avec le paquet ALARM
  # (installable) et le binaire x86_64 de vérification. Nouvelle release à
  # chaque nouveau tag — jamais de réécrasement d'une version publiée.
  release:
    name: Publication de la GitHub Release
    needs: [native-x86_64, alarm-aarch64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les artefacts des deux builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rassembler les fichiers à publier
        run: |
          mkdir -p release
          cp -v artifacts/pkg-alarm-aarch64/*.pkg.tar.* release/
          cp -v artifacts/wine-mobile-launcher-x86_64/wine-mobile-launcher \
            "release/wine-mobile-launcher-${GITHUB_REF_NAME#v}-x86_64"
          ls -la release

      - name: Créer la release et y joindre les paquets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
