name: Build

# Ne compile QUE les versions publiées : un tag vX.Y.Z (major/minor/patch).
# Les pushes sur main ne déclenchent plus rien. Chaque tag produit sa
# GitHub Release, nouvelle à chaque fois, avec les paquets attachés.
# workflow_dispatch permet un build de test manuel (sans release).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# contents: write : le job release crée la GitHub Release et y attache les paquets.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build natif rapide sur Arch x86_64 : vérifie la compilation sans émulation.
  native-x86_64:
    name: Build natif (Arch x86_64)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Préparer le conteneur
        run: |
          pacman -Syu --noconfirm git cmake qt6-base qt6-declarative

      - uses: actions/checkout@v4

      - name: Compiler
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel "$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: wine-mobile-launcher-x86_64
          path: build/wine-mobile-launcher
          if-no-files-found: error

  # Cible principale : Arch Linux ARM (aarch64) via PKGBUILD.
  # Le rootfs ALARM est importé comme image Docker et exécuté sous QEMU
  # (binfmt enregistré par docker/setup-qemu-action, indépendant de l'image
  # Ubuntu du runner et de ses paquets qemu-*).
  alarm-aarch64:
    name: PKGBUILD Arch Linux ARM (aarch64, QEMU/Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WML_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Enregistrer l'émulation aarch64 (binfmt)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Télécharger et importer le rootfs Arch Linux ARM
        run: |
          curl -fL --retry 3 -o /tmp/alarm-rootfs.tar.gz \
            http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
          docker import /tmp/alarm-rootfs.tar.gz alarm:rootfs

      # Étape lente (mise à jour complète + Qt6 sous émulation) : isolée dans
      # une image dérivée via docker commit, pour séparer les échecs.
      - name: Préparer l'image ALARM (pacman + dépendances)
        run: |
          docker run --name alarm-prep -v "$PWD:/work:ro" alarm:rootfs bash -euc '
            # Landlock est indisponible dans ce conteneur : pacman (6.1+) refuse
            # de télécharger tant que son sandbox de téléchargement est actif.
            if pacman --disable-sandbox --version >/dev/null 2>&1; then
              PACMAN_OPTS="--disable-sandbox"
            else
              # pacman 6.1 (sans le flag) : désactivation via la configuration.
              PACMAN_OPTS=""
              sed -i "s/^#\?SandboxUser.*/SandboxUser = root/" /etc/pacman.conf
              grep -q "^SandboxUser" /etc/pacman.conf || printf "\nSandboxUser = root\n" >> /etc/pacman.conf
            fi
            sed -i "s/^CheckSpace/#CheckSpace/" /etc/pacman.conf
            pacman-key --init
            pacman-key --populate archlinuxarm
            pacman $PACMAN_OPTS -Syu --noconfirm
            # -Syu a pu remplacer pacman (6.1 -> 7.x) : re-tester le flag et
            # retirer une directive devenue inconnue pour la nouvelle version.
            if pacman --disable-sandbox --version >/dev/null 2>&1; then
              PACMAN_OPTS="--disable-sandbox"
              sed -i "s/^SandboxUser.*//" /etc/pacman.conf
            fi
            # Source du PKGBUILD : les dépendances déclarées du paquet sont
            # préinstallées ici (makepkg tourne en non-root et ne peut rien
            # installer lui-même), donc prep et PKGBUILD restent en phase.
            . /work/packaging/arch/PKGBUILD
            pacman $PACMAN_OPTS -S --noconfirm --needed \
              base-devel git cmake "${depends[@]}" "${makedepends[@]}"
          '
          docker commit alarm-prep alarm:build
          docker rm alarm-prep

      # makepkg refuse root : tout se fait via l'utilisateur builduser.
      # WML_COMMIT (sha du tag) fixe le commit source ; WML_PKGVER (tag sans
      # son « v ») versionne le paquet d'après la version publiée. Sur un
      # run manuel (branche), WML_PKGVER reste vide : le PKGBUILD garde sa
      # valeur par défaut.
      - name: makepkg (aarch64)
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export WML_PKGVER="${GITHUB_REF_NAME#v}"
          fi
          mkdir -p artifacts
          docker run --rm \
            -e WML_COMMIT \
            -e WML_PKGVER \
            -v "$PWD:/work:ro" \
            -v "$PWD/artifacts:/out" \
            alarm:build bash -euc '
              useradd -m builduser
              mkdir -p /home/builduser/build
              cp /work/packaging/arch/PKGBUILD /home/builduser/build/PKGBUILD
              chown -R builduser:builduser /home/builduser/build
              cd /home/builduser/build
              su -l builduser -c "cd ~/build && makepkg --printsrcinfo > /out/.SRCINFO"
              su -l builduser -c "cd ~/build && makepkg -f --noconfirm"
              cp -v /home/builduser/build/*.pkg.tar.* /out/
            '

      - name: Lister les artefacts
        run: ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-alarm-aarch64
          path: artifacts/*
          if-no-files-found: error

  # Publication : une GitHub Release par tag, avec le paquet ALARM
  # (installable) et le binaire x86_64 de vérification. Nouvelle release à
  # chaque nouveau tag — jamais de réécrasement d'une version publiée.
  release:
    name: Publication de la GitHub Release
    needs: [native-x86_64, alarm-aarch64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les artefacts des deux builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rassembler les fichiers à publier
        run: |
          mkdir -p release
          cp -v artifacts/pkg-alarm-aarch64/*.pkg.tar.* release/
          cp -v artifacts/wine-mobile-launcher-x86_64/wine-mobile-launcher \
            "release/wine-mobile-launcher-${GITHUB_REF_NAME#v}-x86_64"
          ls -la release

      - name: Créer la release et y joindre les paquets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
