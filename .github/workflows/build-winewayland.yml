name: Build winewayland.so (rotation)

# Compile uniquement le pilote Wayland de Wine (winewayland.so, natif aarch64)
# avec le patch de rotation, à partir du Wine exact de GE-Proton11-12.
on:
  push:
    branches: ['feature/**']
    paths:
      - 'winewayland/**'
      - '.github/workflows/build-winewayland.yml'
  workflow_dispatch:

env:
  WINE_REPO: https://github.com/ValveSoftware/wine
  WINE_COMMIT: fda79a585939fb7512dc220a11249f9ffe825fcf
  GE_TAG: GE-Proton11-12

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl clang lld llvm autoconf bison flex gettext pkg-config git \
            libwayland-dev wayland-protocols libxkbcommon-dev libxkbregistry-dev libvulkan-dev \
            libegl-dev libgl-dev libfreetype-dev libfontconfig-dev libgnutls28-dev \
            libunwind-dev libdbus-1-dev libudev-dev libpulse-dev libsdl2-dev

      - name: Récupérer le Wine de GE-Proton
        run: |
          mkdir wine && cd wine
          git init -q
          git remote add origin "$WINE_REPO"
          git fetch -q --depth=1 origin "$WINE_COMMIT"
          git checkout -q FETCH_HEAD

      - name: Patchs GE-Proton (wine-wayland, em-fixups, wineland)
        run: |
          # Même séquence que patches/protonprep-valve-staging.sh de GE-Proton :
          # le pilote winewayland de GE est le Wine de Valve + ces patchs.
          mkdir gep && cd gep
          git init -q
          git remote add origin https://github.com/GloriousEggroll/proton-ge-custom
          git fetch -q --depth=1 --filter=blob:none origin tag "$GE_TAG"
          git checkout -q FETCH_HEAD
          git sparse-checkout init --cone
          git sparse-checkout set patches/wine-hotfixes/wine-wayland patches/wine-hotfixes/em-fixups patches/wine-hotfixes/wineland-child-rendering
          cd ../wine
          P=../gep/patches/wine-hotfixes
          ok=0; ko=0
          apply() { if patch -Np1 --no-backup-if-mismatch -s < "$1"; then ok=$((ok+1)); else ko=$((ko+1)); echo "ECHEC: $1"; fi; }
          for f in $P/wine-wayland/*.patch; do apply "$f"; done
          apply $P/em-fixups/0001-winewayland-add-SNI-tray-icons-and-native-context-me.patch
          for f in $P/wineland-child-rendering/*.patch; do apply "$f"; done
          for f in $P/em-fixups/*.patch; do
            case "$f" in */0001-winewayland-add-SNI*) ;; *) apply "$f" ;; esac
          done
          echo "patchs GE : $ok appliqués, $ko en échec"
          # Nos patchs (rotation, etc.)
          for f in ../winewayland/ge/*.patch; do
            [ -e "$f" ] || continue
            echo "== $f"; patch -Np1 --no-backup-if-mismatch < "$f"
          done

      - name: Générer configure
        run: |
          cd wine
          [ -x configure ] || autoconf
          [ -f include/config.h.in ] || autoheader
          # Fichiers générés absents du dépôt Valve (Proton les régénère au build)
          ./tools/make_requests
          ./tools/make_specfiles
          if [ ! -f include/wine/vulkan.h ]; then
            (cd dlls/winevulkan && python3 make_vulkan -x vk.xml -X video.xml)
          fi

      - name: Configurer
        run: |
          # libxkbcommon de Ubuntu 24.04 (1.6) n'a pas XKB_VMOD_NAME_SCROLL (1.8+)
          printf '%s\n' '#ifndef XKB_VMOD_NAME_SCROLL' '#define XKB_VMOD_NAME_SCROLL "ScrollLock"' '#endif' > "$PWD/xkbcompat.h"
          mkdir build && cd build
          CFLAGS="-g -O2 -include $GITHUB_WORKSPACE/xkbcompat.h" ../wine/configure --enable-win64 --disable-tests \
            --with-wayland --without-x

      - name: Compiler winewayland.so
        run: |
          cd build
          make -j"$(nproc)" dlls/winewayland.drv/winewayland.so

      - name: Récupérer le résultat
        run: |
          mkdir out
          cp build/dlls/winewayland.drv/winewayland.so out/
          cp winewayland/*.patch out/
          (cd out && sha256sum winewayland.so > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: winewayland-rotate-aarch64
          path: out/
